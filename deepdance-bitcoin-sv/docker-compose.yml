version: "3.9"

# Kompatibel mit Umbrel (app_proxy) UND 5tratumOS (direktes Portmapping).
# Siehe ausfuehrlichen Kommentar in deepdance-dashboard/docker-compose.yml.

services:
  app_proxy:
    environment:
      APP_HOST: deepdance-bitcoin-sv_bsv-node_1
      APP_PORT: 8332

  bsv-node:
    image: ghcr.io/deepdance1977/bsv-full-node-arm64:latest
    pull_policy: always
    restart: on-failure
    stop_grace_period: 5m
    environment:
      RPC_USER: deepdance
      RPC_PASSWORD: $APP_PASSWORD
      RPC_ALLOW_IP: 172.16.0.0/12
      NETWORK: mainnet
    ports:
      - "8333:8333"
      - "8332:8332"
    volumes:
      - ${APP_DATA_DIR}/data:/data
