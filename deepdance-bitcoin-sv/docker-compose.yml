version: "3.9"

# Kompatibel mit Umbrel (app_proxy) UND 5tratumOS (direktes Portmapping).
# Siehe ausfuehrlichen Kommentar in deepdance-dashboard/docker-compose.yml.

services:
  app_proxy:
    environment:
      APP_HOST: deepdance-bitcoin-sv_bsv-node_1
      APP_PORT: 8332

  bsv-node:
    image: ghcr.io/deepdance1977/bsv-full-node-arm64:latest
    pull_policy: always
    restart: on-failure
    stop_grace_period: 5m
    environment:
      RPC_USER: deepdance
      # Bewusst FEST (nicht $APP_PASSWORD): 5tratumOS teilt Zugangsdaten
      # nicht automatisch zwischen getrennten Apps. Damit das Dashboard die
      # Node ohne manuelle Konfiguration findet, nutzen beide Apps dasselbe
      # dokumentierte RPC-Passwort. Die RPC-Schnittstelle ist ohnehin nur
      # im lokalen Netzwerk erreichbar (kein Port-Forwarding ins Internet).
      RPC_PASSWORD: deepdance-bsv-rpc-2026
      RPC_ALLOW_IP: 172.16.0.0/12
      NETWORK: mainnet
      # Pruned Mode: Zielgroesse fuer die auf der Platte gehaltenen
      # Blockdaten in MiB. 5000 = ca. 5 GB. Erhoehen, falls mehr Speicher
      # verfuegbar ist und mehr Historie gewuenscht wird.
      PRUNE_SIZE_MB: 5000
    ports:
      - "8333:8333"
      - "8332:8332"
    volumes:
      - ${APP_DATA_DIR}/data:/data
