version: "3.9"

services:
  frontend:
    image: ghcr.io/deepdance1977/deepbsv-frontend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api

  app_proxy:
    environment:
      APP_HOST: frontend
      APP_PORT: 80

  api:
    image: ghcr.io/deepdance1977/deepbsv-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      BSV_RPC_HOST: host.docker.internal
      BSV_RPC_PORT: 8332
      BSV_RPC_USER: deepdance
      BSV_RPC_PASSWORD: deepdance-bsv-rpc-2026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
      - "3333:3333"
