version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: deepdance-deepbsv_frontend_1
      APP_PORT: 80

  frontend:
    image: ghcr.io/deepdance1977/deepbsv-frontend:latest
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - api

  api:
    image: ghcr.io/deepdance1977/deepbsv-api:latest
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "8000:8000"
      - "3333:3333"
