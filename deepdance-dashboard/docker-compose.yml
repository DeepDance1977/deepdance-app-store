version: "3.9"

# Diese docker-compose.yml ist bewusst kompatibel mit ZWEI Plattformen:
#
# 1) Klassisches Umbrel (und Umbrel-treue Forks): nutzt den zentralen
#    "app_proxy"-Reverse-Proxy-Container, der ueber APP_HOST/APP_PORT
#    automatisch mit dem Frontend-Container verbunden wird.
#
# 2) 5tratumOS: hat KEINEN zentralen app_proxy-Mechanismus. Jede App
#    veroeffentlicht ihren Port stattdessen direkt am Host (wie z.B. die
#    mitgelieferten Apps axebch, hashwatcher etc.). Deshalb zusaetzlich
#    ein explizites "ports:"-Mapping am Frontend-Service.
#
# Beide Eintraege koennen gefahrlos nebeneinander stehen: Umbrel nutzt den
# app_proxy und ignoriert das zusaetzliche Portmapping (nur intern relevant),
# 5tratumOS ignoriert den unbekannten app_proxy-Service und nutzt einfach
# das direkte Portmapping.

services:
  app_proxy:
    environment:
      APP_HOST: deepdance-dashboard_frontend_1
      APP_PORT: 80

  postgres:
    image: postgres:16-alpine
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: bsvdash
      POSTGRES_PASSWORD: $APP_PASSWORD
      POSTGRES_DB: bsvdash
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsvdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/deepdance1977/bsv-solo-mining-dashboard-backend:latest
    pull_policy: always
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://bsvdash:$APP_PASSWORD@postgres:5432/bsvdash
      SECRET_KEY: $APP_SEED
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: $APP_PASSWORD
      BSV_RPC_HOST: $APP_BITCOIN_NODE_IP
      BSV_RPC_PORT: $APP_BITCOIN_RPC_PORT
      BSV_RPC_USER: $APP_BITCOIN_RPC_USER
      BSV_RPC_PASSWORD: $APP_BITCOIN_RPC_PASS
      STRATUM_API_URL: http://$APP_BITCOIN_NODE_IP:9000/stats
    volumes:
      - ${APP_DATA_DIR}/data/backend:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/deepdance1977/bsv-solo-mining-dashboard-frontend:latest
    pull_policy: always
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      backend:
        condition: service_healthy
    # Nur fuer 5tratumOS relevant (kein app_proxy vorhanden). Der Port muss
    # zum "port"-Feld in umbrel-app.yml passen (hier: 3000).
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
