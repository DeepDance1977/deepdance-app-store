manifestVersion: 1
id: deepdance-dashboard
category: bitcoin
name: BSV Solo Mining Dashboard
version: "1.0.0"
tagline: Web-Dashboard fuer deine Bitcoin SV Full Node und dein Solo-Mining-Setup
description: >-
  BSV Solo Mining Dashboard ist ein modernes, quelloffenes Web-Dashboard zur
  Ueberwachung einer Bitcoin SV Full Node und einer Solo-Mining-Umgebung.

  Funktionen:
  - Node-Ueberwachung: Sync-Status, Blockhoehe, Peers, Difficulty,
    Netzwerk-Hashrate, Uptime sowie CPU-, RAM-, Disk- und Temperaturanzeige
    des Raspberry Pi.
  - Solo-Mining-Ueberwachung: alle am Stratum-Server angemeldeten Miner mit
    Name, IP, Hashrate, akzeptierten/abgelehnten Shares, Uptime und
    Online/Offline-Status.
  - Wallet-Uebersicht: Empfangsadresse, Guthaben, letzte Transaktionen und
    Mining-Belohnungen.
  - Live-Dashboard mit Dark Mode, Charts und automatischer Aktualisierung
    per WebSocket - ohne Neuladen der Seite.
  - Telegram-Benachrichtigungen bei Miner-Online/Offline, gefundenen
    Bloecken und Node-Fehlern.
  - Benutzerverwaltung mit Rollenmodell (Admin/Operator/Betrachter) und
    JWT-Authentifizierung.
developer: DeepDance
website: https://github.com/DeepDance1977/bsv-solo-mining-dashboard
# HINWEIS: Die Abhaengigkeit zur Node-App (deepdance-bitcoin-sv) ist
# vorerst entfernt, bis deren Docker-Image fertig gebaut ist. Die
# Dashboard-App laesst sich so unabhaengig installieren und zeigt bis
# dahin einfach "Node nicht erreichbar" an. Nach dem Node-Build wieder
# einkommentieren:
# dependencies:
#   - deepdance-bitcoin-sv
repo: https://github.com/DeepDance1977/bsv-solo-mining-dashboard
support: https://github.com/DeepDance1977/bsv-solo-mining-dashboard/issues
port: 3000
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: "admin"
defaultPassword: "$APP_PASSWORD"
submitter: DeepDance
submission: https://github.com/DeepDance1977/bsv-solo-mining-dashboard
releaseNotes: >-
  Erstveroeffentlichung: vollstaendiges Node-, Mining- und Wallet-Dashboard
  fuer Bitcoin SV mit Live-Updates, Telegram-Alerts und Benutzerverwaltung.
